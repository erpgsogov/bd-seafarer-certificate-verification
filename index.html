<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDC Verification Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="left-panel">
            <div class="brand-content">
                <h1>Verification Portal</h1>
                <p>Secure online verification system.</p>
            </div>
        </div>
        <div class="right-panel">
            <div class="form-card">
                <div class="form-header">CDC Verification</div>
                <div class="form-row">
                    <label>CDC Number <span>*</span></label>
                    <input type="text" placeholder="Enter CDC No">
                </div>
                <div class="form-row">
                    <label>Date of Birth <span>*</span></label>
                    <input type="date">
                </div>
                <div class="button-row">
                    <div class="form-row">
                        <label></label>
                        <button type="submit">Submit</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
