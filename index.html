<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Government Shipping Office - CDC Verification</title>
    
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/8/84/Government_Seal_of_Bangladesh.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-wrapper">
        <!-- Left Panel / Branding -->
        <div class="left-panel">
            <div class="brand-content">
                <div class="logo-circle">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Government_Seal_of_Bangladesh.svg" alt="Seal">
                </div>
                <h1>Government Shipping Office</h1>
                <p>Online Application for CDC, Roster, Article & Signon/Signoff</p>
            </div>
        </div>

        <!-- Right Content Panel -->
        <div class="right-panel">
            <div id="searchView">
                <div class="form-container">
                    <h2>CDC Verification</h2>
                    <form id="verificationForm">
                        <div class="form-group">
                            <label>CDC Number *</label>
                            <input type="text" id="certificateNo" placeholder="Enter CDC Number" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Date of Birth *</label>
                            <input type="date" id="dateOfBirth" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Verification Code *</label>
                            <div class="captcha-flex" style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                                <span id="captchaDisplay" style="font-size: 22px; font-weight: bold; background: #eef2f7; padding: 5px 15px; letter-spacing: 3px; border: 1px dashed #ccc;">703215</span>
                                <button type="button" onclick="generateCaptcha()" style="padding: 8px 12px; cursor: pointer;"><i class="fa-solid fa-rotate-right"></i></button>
                            </div>
                            <input type="text" id="captchaInput" placeholder="Please enter the numbers displayed above" required>
                        </div>
                        
                        <button type="submit" class="btn-search"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
                    </form>

                    <!-- Result Box -->
                    <div id="resultBox" style="display: none; margin-top: 20px;">
                        <table border="1" width="100%" style="border-collapse: collapse; text-align: center;">
                            <thead>
                                <tr style="background: #f4f6f9;">
                                    <th>SL</th>
                                    <th>Name</th>
                                    <th>Date of Birth</th>
                                    <th>CDC No</th>
                                    <th>Issue Date</th>
                                    <th>Expiry Date</th>
                                    <th>Place of Issue</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="resultTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Details View -->
            <div id="detailsView" style="display: none;">
                <h2>Seafarer Details</h2>
                <div class="profile-section" style="text-align: center; margin-bottom: 20px;">
                    <img id="profileImage" src="https://via.placeholder.com/75x95?text=Photo" alt="Seafarer Photo" width="95" height="115" style="object-fit: cover; border: 1px solid #ddd;">
                    <br>
                    <input type="file" id="imageLoader" accept="image/*" onchange="previewFile(this)" style="margin-top: 10px;">
                </div>
                
                <p><strong>CDC Number:</strong> <span id="detCdcNo"></span></p>
                <p><strong>CDC Number Cell:</strong> <span id="detCdcNumCell"></span></p>
                <p><strong>Date of Birth:</strong> <span id="detDobCell"></span></p>
                
                <button type="button" onclick="showSearchView()" class="btn-search" style="margin-top: 20px;">Back to Search</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Section -->
    <script>
        function generateCaptcha() {
            var randomNum = Math.floor(100000 + Math.random() * 900000);
            var captchaElem = document.getElementById('captchaDisplay');
            if(captchaElem) captchaElem.innerText = randomNum;
        }

        window.onload = function() {
            generateCaptcha();
            var profileImg = document.getElementById('profileImage');
            var savedImage = localStorage.getItem('gsoProfileImage');
            
            if(savedImage && profileImg) {
                profileImg.src = savedImage;
            }
        };

        var vForm = document.getElementById('verificationForm');
        if(vForm) {
            vForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                var userCaptcha = document.getElementById('captchaInput').value.trim();
                var actualCaptcha = document.getElementById('captchaDisplay').innerText.trim();

                if(userCaptcha !== actualCaptcha) {
                    alert("Invalid Verification Code! Please enter the exact code shown above.");
                    generateCaptcha();
                    document.getElementById('captchaInput').value = "";
                    return;
                }

                var currentCdc = document.getElementById('certificateNo').value.trim().toUpperCase();
                var currentDob = document.getElementById('dateOfBirth').value;

                var tableBody = document.getElementById('resultTableBody');
                tableBody.innerHTML = "";

                var validCdc = "C/O/6628";
                var validDob = "1990-04-05";

                if (currentCdc === validCdc && currentDob === validDob) {
                    var formattedDob = "05-04-1990";
                    
                    var rowHTML = `
                        <tr>
                            <td>1</td>
                            <td>MD KHALILUR RAHMAN</td>
                            <td>${formattedDob}</td>
                            <td>${currentCdc}</td>
                            <td>29 Jan 2024</td>
                            <td>29 Jan 2034</td>
                            <td>CHATTOGRAM</td>
                            <td><button class="btn-details" onclick="showDetailsView()"><i class="fa-solid fa-eye"></i> Details</button></td>
                        </tr>
                    `;
                    tableBody.innerHTML = rowHTML;

                    document.getElementById('detCdcNo').innerText = currentCdc;
                    document.getElementById('detCdcNumCell').innerText = currentCdc;
                    document.getElementById('detDobCell').innerText = "05 APRIL 1990";
                } else {
                    tableBody.innerHTML = `<tr><td colspan="8" class="no-data-msg" style="color: red; padding: 10px;">No Data Found for the given CDC Number and Date of Birth!</td></tr>`;
                }

                document.getElementById('resultBox').style.display = 'block';
            });
        }

        function showDetailsView() {
            document.getElementById('searchView').style.display = 'none';
            document.getElementById('detailsView').style.display = 'block';
        }

        function showSearchView() {
            document.getElementById('detailsView').style.display = 'none';
            document.getElementById('searchView').style.display = 'block';
            generateCaptcha();
            document.getElementById('captchaInput').value = "";
        }

        function previewFile(input) {
            var file = input.files[0];
            if (file) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('profileImage').src = e.target.result;
                    localStorage.setItem('gsoProfileImage', e.target.result);
                }
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
