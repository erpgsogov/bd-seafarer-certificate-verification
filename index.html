<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Government Shipping Office - CDC Verification</title>
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-wrapper">
        <header class="top-header">
            <div class="logo-container">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Government_Seal_of_Bangladesh.svg" alt="Government Seal" class="gov-logo">
            </div>
            
            <div class="contact-info">
                <p class="alert-time">🔔 (Get in Touch : 9 AM to 6 PM)</p>
                <p class="hotline">📞 Hotline : 01972 380 814, 01972 380 821</p>
                <p class="email">✉️ Email : support@gso.gov.bd</p>
            </div>

            <div class="verification-title">
                <span class="icon-down">⬇️</span>
                <h1>CDC VERIFICATION</h1>
            </div>
        </header>

        <section class="form-section">
            <form id="verificationForm">
                <div class="form-group">
                    <label for="cdcNumber">CDC Number <span>*</span></label>
                    <input type="text" id="cdcNumber" name="cdcNumber" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth <span>*</span></label>
                    <div class="input-with-icon">
                        <input type="text" id="dob" name="dob" placeholder="dd-mm-yyyy" required>
                        <span class="icon-calendar">📅</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="captcha">Verification Code <span>*</span></label>
                    <div class="captcha-display">
                        <span class="captcha-text" id="captchaCode"></span>
                    </div>
                    <input type="text" id="captcha" name="captcha" placeholder="Please enter the numbers displayed above" required>
                </div>

                <button type="submit" class="search-btn">🔍 Search</button>
            </form>
        </section>

        <footer class="site-footer">
            <p>Copyright © 2021-2022 Government Shipping Office, Chattogram. All Rights Reserved.</p>
        </footer>
    </div>

    <script>
        function generateCaptcha() {
            var code = Math.floor(100000 + Math.random() * 900000);
            document.getElementById('captchaCode').innerText = code;
        }
        generateCaptcha();
    </script>

</body>
</html>
