<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Government Shipping Office - CDC Verification</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Basic Reset & Font */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            /* This important prevents users from selecting text, making it look more like a secure system */
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10 and IE 11 */
            user-select: none;
        }

        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #edf1f5;
            overflow-x: hidden;
        }

        /* Page Layout Structure */
        .page-wrapper {
            display: flex;
            flex-direction: row;
            width: 100vw;
            min-height: 100vh;
        }

        /* Left Green Panel */
        .left-panel {
            width: 50%;
            min-height: 100vh;
            background-color: #00833d;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
            border-right: 5px solid #006630;
        }

        .brand-content {
            max-width: 480px;
        }

        .logo-circle {
            width: 115px;
            height: 115px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            padding: 4px;
        }

        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .brand-content h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ffffff;
            line-height: 1.2;
            text-transform: uppercase;
        }

        .brand-content p {
            font-size: 14px;
            color: #ffffff;
            opacity: 0.95;
            line-height: 1.4;
            font-weight: 400;
        }

        /* Right Grey Panel */
        .right-panel {
            width: 50%;
            min-height: 100vh;
            background-color: #edf1f5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 20px;
            overflow-y: auto;
        }

        /* Top Contact Info */
        .top-contact-info {
            text-align: center;
            font-size: 12px;
            color: #b38600;
            margin-bottom: 20px;
            line-height: 1.6;
            font-weight: bold;
        }

        /* Search Form Card */
        .form-card {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 620px;
            margin: auto;
            border: 1px solid #dce3e8;
        }

        .form-header {
            font-size: 15px;
            font-weight: bold;
            color: #0073aa;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
        }

        .form-row label {
            width: 140px;
            font-size: 13px;
            color: #333;
            font-weight: bold;
            text-align: right;
            padding-right: 15px;
            white-space: nowrap;
        }

        .form-row label span {
            color: red;
        }

        .form-row input {
            flex: 1;
            height: 36px;
            padding: 6px 12px;
            border: 1px solid #bce8f1;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
            background-color: #ffffff;
            transition: border-color 0.2s;
        }

        .form-row input:focus {
            border-color: #66afe9;
        }

        /* Captcha Styling */
        .captcha-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 6px;
        }

        .captcha-box-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .captcha-box {
            font-family: 'Courier New', Courier, monospace;
            font-size: 26px;
            font-weight: bold;
            color: #1a0dab;
            letter-spacing: 5px;
            background: #f9f9f9;
            padding: 4px 12px;
            border: 1px dashed #ccc;
            display: inline-block;
            width: fit-content;
            user-select: all; /* Allow copying captcha */
        }

        .btn-refresh {
            background: none;
            border: none;
            color: #0073aa;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            transition: transform 0.3s;
        }

        .btn-refresh:hover {
            transform: rotate(180deg);
            color: #0056b3;
        }

        .form-row button {
            background-color: #00a2ed;
            color: white;
            border: none;
            padding: 8px 22px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s;
        }

        .form-row button:hover {
            background-color: #008ecf;
        }

        /* Result Section (Initially Hidden) */
        .result-box {
            margin-top: 25px;
            width: 100%;
            display: none; /* Hidden by default */
        }

        .result-header {
            font-size: 15px;
            font-weight: bold;
            color: #2b7bb9;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            background: #ffffff;
            border: 1px solid #dce3e8;
            padding: 2px;
        }

        .gso-result-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
        }

        .gso-result-table th, .gso-result-table td {
            padding: 10px;
            border: 1px solid #dce3e8;
            white-space: nowrap;
            color: #333;
        }

        .gso-result-table th {
            background-color: #f8f9fa;
            font-weight: bold;
        }

        .btn-details {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-details:hover {
            background-color: #43a047;
        }

        /* Details View (Initially Hidden) */
        .details-container {
            width: 100%;
            max-width: 820px;
            margin: auto;
            background: #ffffff;
            border: 1px solid #dce3e8;
            border-radius: 4px;
            padding: 15px;
            display: none; /* Hidden by default */
        }

        .top-title-bar {
            background-color: #ffffff;
            border-bottom: 2px solid #2b7bb9;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .top-title-bar h2 {
            font-size: 14px;
            color: #333;
            font-weight: bold;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .info-table td {
            padding: 6px 8px;
            border: 1px solid #e0e0e0;
            color: #333;
        }

        .info-table td.label-cell {
            font-weight: bold;
            text-align: right;
            width: 42%;
            background-color: #f9f9f9;
        }

        .status-active {
            color: #008000;
            font-weight: bold;
        }

        .profile-img-wrap {
            text-align: center;
        }

        .profile-img {
            width: 95px;
            height: 115px;
            object-fit: cover;
            border: 1px solid #ccc;
            background-color: #f0f0f0;
            display: block;
            margin: 0 auto 8px auto;
            border-radius: 2px;
        }

        .blue-banner-header {
            background-color: #00a2ed;
            color: white;
            font-size: 12px;
            font-weight: bold;
            padding: 8px 12px;
            margin-top: 20px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .detail-data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            text-align: center;
        }

        .detail-data-table th, .detail-data-table td {
            padding: 8px 5px;
            border: 1px solid #dce3e8;
            color: #333;
        }

        .detail-data-table th {
            background-color: #f5f5f5;
            font-weight: bold;
        }

        /* Site Footer */
        .site-footer {
            text-align: center;
            font-size: 11px;
            color: #444;
            margin-top: auto;
            padding-top: 20px;
            padding-bottom: 10px;
            border-top: 1px solid #eee;
        }

        /* Utility Classes */
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- Main Page Wrapper -->
    <div class="page-wrapper">
        <!-- Left Green Panel -->
        <div class="left-panel">
            <div class="brand-content">
                <div class="logo-circle">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Government_Seal_of_Bangladesh.svg" alt="Government Seal">
                </div>
                <h1>Government Shipping Office</h1>
                <p>(Online Application for CDC, Roster, eArticle & SignOn/SignOff)</p>
            </div>
        </div>

        <!-- Right Content Panel -->
        <div class="right-panel">
            <!-- Search View (The main form) -->
            <div id="searchView">
                <div class="top-contact-info">
                    <p><i class="fa-regular fa-bell"></i> (Get in Touch : 9 AM to 6 PM)</p>
                    <p><i class="fa-brands fa-whatsapp"></i> Hotline : 01972 380 814</p>
                </div>

                <div class="form-card">
                    <div class="form-header">
                        <i class="fa-regular fa-compass"></i> CDC VERIFICATION
                    </div>

                    <form id="verificationForm">
                        <div class="form-row">
                            <label for="certificateNo">CDC Number <span>*</span></label>
                            <input type="text" id="certificateNo" name="certificateNo" placeholder="C/O/XXXX" required>
                        </div>
                        <div class="form-row">
                            <label for="dateOfBirth">Date of Birth <span>*</span></label>
                            <input type="date" id="dateOfBirth" name="dateOfBirth" required>
                        </div>
                        <div class="form-row">
                            <label for="captchaInput">Verification Code <span>*</span></label>
                            <div class="captcha-container">
                                <div class="captcha-box-wrap">
                                    <div class="captcha-box" id="captchaDisplay"></div>
                                    <button type="button" class="btn-refresh" id="refreshCaptcha" title="Refresh Code">
                                        <i class="fa-solid fa-rotate-right"></i>
                                    </button>
                                </div>
                                <input type="text" id="captchaInput" name="captchaInput" placeholder="Enter code" required>
                            </div>
                        </div>
                        <div class="form-row button-row">
                            <label></label>
                            <button type="submit"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
                        </div>
                    </form>

                    <!-- Result Box (Appears after clicking Search) -->
                    <div id="resultBox" class="result-box">
                        <div class="result-header">CDC VERIFICATION RESULT</div>
                        <div class="table-responsive">
                            <table class="gso-result-table">
                                <thead>
                                    <tr>
                                        <th>NAME</th>
                                        <th>CDC NUMBER</th>
                                        <th>DETAILS</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>MD KHALILUR RAHMAN</td>
                                        <td id="resultCdcNo">C/O
