<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bangladesh Seafarer Certificate Verification System">
    <meta name="robots" content="index, follow">
    <title>Bangladesh Seafarer Certificate Verification</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <!-- HEADER CONTENT -->
    </header>

    <main class="container">
        <section class="card">
            <h2>Verify Seafarer Certificate</h2>
            
            <form id="verificationForm">
                <div class="form-group">
                    <label for="certificateNo">CDC No.</label>
                    <input 
                        type="text" 
                        id="certificateNo" 
                        placeholder="Enter CDC No." 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="dateOfBirth">Date of Birth</label>
                    <input 
                        type="date" 
                        id="dateOfBirth" 
                        required
                    >
                </div>

                <button type="submit" id="verifyButton">VERIFY CERTIFICATE</button>
            </form>

            <div id="resultBox" class="result-box" style="display: none;"></div>
        </section>
    </main>

    <footer class="footer">
        <!-- FOOTER CONTENT -->
    </footer>

    <!-- SUPABASE JAVASCRIPT LIBRARY -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- YOUR CUSTOM SCRIPT (MUST LOAD AFTER SUPABASE) -->
    <script src="script.js"></script>

</body>
</html>
