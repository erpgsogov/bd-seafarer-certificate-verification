```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Bangladesh Seafarer Certificate Verification System">

    <meta name="robots"
          content="index, follow">

    <title>Bangladesh Seafarer Certificate Verification</title>


    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f6fa;
            color: #222;
            min-height: 100vh;
        }


        /* ================================
           HEADER
           ================================ */

        .header {
            background: #003b70;
            color: #ffffff;
            text-align: center;
            padding: 28px 15px;
            border-bottom: 4px solid #0066b3;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            line-height: 1.3;
        }

        .header p {
            margin: 9px 0 0;
            font-size: 15px;
            opacity: 0.95;
        }


        /* ================================
           MAIN CONTAINER
           ================================ */

        .container {
            width: 100%;
            max-width: 680px;
            margin: 45px auto;
            padding: 0 15px;
        }


        /* ================================
           CARD
           ================================ */

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
            border: 1px solid #e1e7ed;
        }

        .card h2 {
            margin: 0 0 28px;
            text-align: center;
            color: #003b70;
            font-size: 23px;
            font-weight: 700;
        }


        /* ================================
           FORM
           ================================ */

        .form-group {
            margin-bottom: 21px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #333333;
            font-size: 15px;
        }

        .form-group input {
            display: block;
            width: 100%;
            height: 50px;
            padding: 12px 14px;
            border: 1px solid #c8d0d8;
            border-radius: 7px;
            background: #ffffff;
            color: #222222;
            font-size: 16px;
            outline: none;
            transition: 0.2s ease;
        }

        .form-group input::placeholder {
            color: #888888;
        }

        .form-group input:focus {
            border-color: #0066b3;
            box-shadow: 0 0 0 3px rgba(0, 102, 179, 0.12);
        }


        /* ================================
           BUTTON
           ================================ */

        .verify-button {
            display: block;
            width: 100%;
            height: 52px;
            margin-top: 8px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #0066b3;
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease,
                        transform 0.1s ease;
        }

        .verify-button:hover {
            background: #004f8c;
        }

        .verify-button:active {
            transform: scale(0.99);
        }

        .verify-button:focus {
            outline: 3px solid rgba(0, 102, 179, 0.20);
            outline-offset: 2px;
        }


        /* ================================
           RESULT BOX
           ================================ */

        .result-box {
            display: none;
            margin-top: 26px;
            padding: 20px;
            border-radius: 8px;
            line-height: 1.8;
            font-size: 15px;
            word-wrap: break-word;
        }


        /* SUCCESS */

        .result-success {
            display: block;
            background: #eaf8ee;
            border: 1px solid #4caf50;
            color: #155724;
        }

        .result-success strong {
            font-size: 18px;
        }


        /* ERROR */

        .result-error {
            display: block;
            background: #fff0f0;
            border: 1px solid #dc3545;
            color: #721c24;
        }

        .result-error strong {
            font-size: 17px;
        }


        /* ================================
           FOOTER
           ================================ */

        .footer {
            text-align: center;
            color: #666666;
            font-size: 13px;
            line-height: 1.7;
            padding: 25px 15px 40px;
        }

        .footer strong {
            color: #003b70;
        }


        /* ================================
           MOBILE
           ================================ */

        @media (max-width: 600px) {

            .header {
                padding: 22px 12px;
            }

            .header h1 {
                font-size: 22px;
            }

            .header p {
                font-size: 14px;
            }

            .container {
                margin: 25px auto;
                padding: 0 12px;
            }

            .card {
                padding: 22px 18px;
                border-radius: 10px;
            }

            .card h2 {
                font-size: 20px;
                margin-bottom: 23px;
            }

            .form-group input {
                height: 48px;
                font-size: 16px;
            }

            .verify-button {
                height: 50px;
                font-size: 16px;
            }

            .result-box {
                padding: 17px;
                font-size: 14px;
            }

        }

    </style>

</head>


<body>


    <!-- ================================
         HEADER
         ================================ -->

    <header class="header">

        <h1>
            Bangladesh Seafarer Certificate Verification
        </h1>

        <p>
            Certificate / CDC Verification System
        </p>

    </header>


    <!-- ================================
         MAIN CONTENT
         ================================ -->

    <main class="container">

        <section class="card">

            <h2>
                Verify Seafarer Certificate
            </h2>


            <!-- ================================
                 VERIFICATION FORM
                 ================================ -->

            <form
                id="verificationForm"
                novalidate
            >


                <!-- CDC NUMBER -->

                <div class="form-group">

                    <label for="certificateNo">
                        CDC No.
                    </label>

                    <input
                        type="text"
                        id="certificateNo"
                        name="certificateNo"
                        placeholder="Enter CDC No."
                        autocomplete="off"
                        autocapitalize="characters"
                        spellcheck="false"
                        required
                    >

                </div>


                <!-- DATE OF BIRTH -->

                <div class="form-group">

                    <label for="dateOfBirth">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="dateOfBirth"
                        name="dateOfBirth"
                        required
                    >

                </div>


                <!-- VERIFY BUTTON -->

                <button
                    type="submit"
                    id="verifyButton"
                    class="verify-button"
                >
                    VERIFY CERTIFICATE
                </button>

            </form>


            <!-- ================================
                 RESULT
                 ================================ -->

            <div
                id="resultBox"
                class="result-box"
                role="alert"
                aria-live="polite"
            ></div>

        </section>

    </main>


    <!-- ================================
         FOOTER
         ================================ -->

    <footer class="footer">

        <strong>
            Bangladesh Seafarer Certificate Verification
        </strong>

        <br>

        Online Certificate Verification System

    </footer>


    <!-- ================================
         SUPABASE JAVASCRIPT LIBRARY
         
         IMPORTANT:
         This MUST load before script.js
         ================================ -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- ================================
         YOUR VERIFICATION SCRIPT
         ================================ -->

    <script src="script.js"></script>


</body>

</html>
```
