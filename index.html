<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seafarer Verification Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- Left Panel -->
        <div class="left-panel">
            <div class="brand-content">
                <div class="logo-circle">
                    <!-- আপনার লোগো বা ছবি এখানে দিতে পারেন -->
                    <span style="color: #0b8043; font-weight: bold; font-size: 14px;">LOGO</span>
                </div>
                <h1>MARINER TITO</h1>
                <p>Merchant Navy Chief Officer Verification System</p>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="right-panel">
            <div class="top-contact-info">
                Online Verification Portal for Seafarers (CDC & Date of Birth)
            </div>

            <div class="form-card">
                <div class="form-header">
                    <span>🔒</span> CDC & Seafarer Verification
                </div>
                
                <div class="form-row">
                    <label>CDC Number <span>*</span></label>
                    <input type="text" placeholder="Enter CDC Number">
                </div>

                <div class="form-row">
                    <label>Date of Birth <span>*</span></label>
                    <input type="date">
                </div>

                <div class="form-row">
                    <label>Verification Code <span>*</span></label>
                    <div class="captcha-container">
                        <div class="captcha-box">A8K9M</div>
                        <input type="text" placeholder="Enter code">
                    </div>
                </div>

                <div class="button-row">
                    <div class="form-row">
                        <label></label>
                        <button type="submit">Verify Now</button>
                    </div>
                </div>
            </div>

            <div class="site-footer">
                &copy; 2026 Maritime Department. All Rights Reserved.<br>
                <a href="#">Privacy Policy</a> | <a href="#">Terms of Use</a>
            </div>
        </div>
    </div>
</body>
</html>
