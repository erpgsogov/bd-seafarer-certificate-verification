<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangladesh Seafarer Certificate Verification - CDC VERIFICATION</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="page-wrapper">
        <!-- LEFT PANEL WITH SHIP PATTERN -->
        <div class="left-panel">
            <div class="brand-content">
                <div class="logo-circle">
                    <img src="images.jpeg" alt="Government Seal of Bangladesh" id="govLogo">
                </div>
                <h1>Government Shipping Office</h1>
                <p>(Online Application for CDC, Roster, eArticle & SignOn/SignOff)</p>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">
            <div class="form-card">
                <div class="form-header">
                    <i class="fa-regular fa-compass"></i> CDC VERIFICATION
                </div>

                <form id="verificationForm">
                    <div class="form-row">
                        <label for="certificateNo">CDC Number <span>*</span></label>
                        <input type="text" id="certificateNo" required>
                    </div>

                    <div class="form-row">
                        <label for="dateOfBirth">Date of Birth <span>*</span></label>
                        <input type="date" id="dateOfBirth" required>
                    </div>

                    <div class="form-row button-row">
                        <label></label>
                        <button type="submit" id="verifyButton">
                            <i class="fa-solid fa-magnifying-glass"></i> Search
                        </button>
                    </div>
                </form>

                <div id="resultBox" class="result-box" style="display: none;"></div>
            </div>

            <footer class="site-footer">
                <p>Copyright © 2021-2022 Government Shipping Office, Chattogram. All Rights Reserved.</p>
                <p>Maintenance By : <a href="#">TechSpark Limited</a></p>
            </footer>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
